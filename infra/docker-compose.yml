services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aspcrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  crm:
    build:
      context: ../apps/crm-dotnet
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DatabaseProvider: Postgres
      ConnectionStrings__PostgresConnection: Host=db;Port=5432;Database=aspcrm;Username=postgres;Password=postgres
    depends_on:
      - db
    ports:
      - "5284:8080"
    restart: on-failure

  shop:
    build:
      context: ../apps/shop-jakarta
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: aspcrm
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_URL: jdbc:postgresql://db:5432/aspcrm
      CRM_API_URL: http://crm:8080/api/shop/tickets
    depends_on:
      - db
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  pgdata: {}
