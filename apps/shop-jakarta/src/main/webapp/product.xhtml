<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/templates/layout.xhtml">
    <f:metadata>
        <f:viewParam name="id" value="#{productDetailBean.productId}"/>
        <f:event type="preRenderView" listener="#{productDetailBean.load}"/>
    </f:metadata>

    <ui:define name="title">Produkt</ui:define>
    <ui:define name="content">
        <h:panelGroup rendered="#{not empty productDetailBean.product}">
            <div class="row g-4">
                <div class="col-md-8">
                    <h2 class="mb-2">#{productDetailBean.product.name}</h2>
                    <p class="text-muted">SKU: #{productDetailBean.product.sku}</p>
                    <p>#{productDetailBean.product.description}</p>
                    <p class="fw-bold fs-4">#{productDetailBean.product.price} zł</p>
                    <p class="text-secondary">Dostępne: #{productDetailBean.product.stockQuantity}</p>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h:form styleClass="vstack gap-3">
                                <div>
                                    <h:outputLabel for="qty" value="Ilość" styleClass="form-label"/>
                                    <h:inputText id="qty" value="#{productDetailBean.quantity}" styleClass="form-control" size="3"/>
                                </div>
                                <h:commandButton value="Dodaj do koszyka" action="#{productDetailBean.addToCart}" styleClass="btn btn-success"/>
                                <a href="cart.jsf" class="btn btn-link">Przejdź do koszyka</a>
                            </h:form>
                        </div>
                    </div>
                </div>
            </div>
        </h:panelGroup>
    </ui:define>
</ui:composition>
