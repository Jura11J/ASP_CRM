<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:h="http://xmlns.jcp.org/jsf/html"
              xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
              xmlns:f="http://xmlns.jcp.org/jsf/core">
    <div class="col">
        <div class="card h-100 shadow-sm product-card">
            <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title mb-0">#{prod.name}</h5>
                    <span class="badge bg-secondary">#{prod.sku}</span>
                </div>
                <p class="card-text text-muted flex-grow-1 small">#{prod.description}</p>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <div>
                        <div class="fw-bold fs-5">#{prod.price} zł</div>
                        <small class="text-secondary">Stan: #{prod.stockQuantity}</small>
                    </div>
                    <div class="d-flex gap-2">
                        <h:form styleClass="d-flex gap-2 mb-0">
                            <h:commandButton value="Dodaj" action="#{cartBean.addProduct(prod.id)}" styleClass="btn btn-sm btn-success"/>
                            <h:link outcome="product" styleClass="btn btn-sm btn-outline-primary" includeViewParams="true">
                                <f:param name="id" value="#{prod.id}"/>
                                Szczegóły
                            </h:link>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ui:component>
