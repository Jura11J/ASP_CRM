<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Rejestracja</ui:define>
    <ui:define name="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="eyebrow mb-1">Nowe konto</p>
                        <h3 class="mb-2">Załóż konto</h3>
                        <p class="text-muted">Utworzymy konto sklepu oraz powiązanego klienta w bazie CRM.</p>
                        <h:form styleClass="row g-3">
                            <div class="col-md-6">
                                <h:outputLabel for="email" value="E-mail" styleClass="form-label"/>
                                <h:inputText id="email" value="#{authBean.email}" required="true" styleClass="form-control" autocomplete="email"/>
                            </div>
                            <div class="col-md-6">
                                <h:outputLabel for="password" value="Hasło" styleClass="form-label"/>
                                <h:inputSecret id="password" value="#{authBean.newPassword}" required="true" styleClass="form-control" autocomplete="new-password"/>
                            </div>
                            <div class="col-md-6">
                                <h:outputLabel for="repeatPass" value="Powtórz hasło" styleClass="form-label"/>
                                <h:inputSecret id="repeatPass" value="#{authBean.repeatPassword}" required="true" styleClass="form-control" autocomplete="new-password"/>
                            </div>
                            <div class="col-md-6">
                                <h:outputLabel for="firstName" value="Imię" styleClass="form-label"/>
                                <h:inputText id="firstName" value="#{authBean.firstName}" required="true" styleClass="form-control"/>
                            </div>
                            <div class="col-md-6">
                                <h:outputLabel for="lastName" value="Nazwisko" styleClass="form-label"/>
                                <h:inputText id="lastName" value="#{authBean.lastName}" required="true" styleClass="form-control"/>
                            </div>
                            <div class="col-md-6">
                                <h:outputLabel for="phone" value="Telefon" styleClass="form-label"/>
                                <h:inputText id="phone" value="#{authBean.phone}" styleClass="form-control"/>
                            </div>
                            <div class="col-md-6">
                                <h:outputLabel for="contact" value="Preferowany kontakt" styleClass="form-label"/>
                                <h:selectOneMenu id="contact" value="#{authBean.preferredContact}" styleClass="form-select">
                                    <f:selectItem itemLabel="E-mail" itemValue="Email"/>
                                    <f:selectItem itemLabel="Telefon" itemValue="Phone"/>
                                </h:selectOneMenu>
                            </div>
                            <div class="col-md-8">
                                <h:outputLabel for="address" value="Adres" styleClass="form-label"/>
                                <h:inputText id="address" value="#{authBean.address}" styleClass="form-control"/>
                            </div>
                            <div class="col-md-4">
                                <h:outputLabel for="city" value="Miasto" styleClass="form-label"/>
                                <h:inputText id="city" value="#{authBean.city}" styleClass="form-control"/>
                            </div>
                            <div class="col-12 form-check">
                                <h:selectBooleanCheckbox id="marketing" value="#{authBean.marketingConsent}" styleClass="form-check-input"/>
                                <h:outputLabel for="marketing" value="Zgoda marketingowa" styleClass="form-check-label"/>
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <h:commandButton value="Zarejestruj" action="#{authBean.register}" styleClass="btn btn-primary"/>
                                <a href="index.jsf" class="btn btn-link">Wróć do sklepu</a>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
